name: verify demos

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fast, no toolchains: demos.json, fixture structure, devcontainer agreement.
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax-check lifecycle scripts
        run: |
          for f in scripts/*.mjs scripts/lib/*.mjs; do
            node --check "$f"
          done

      # Semantic validation activates as soon as a `drift` binary is on PATH.
      # Until @usedrift/cli is published this install is expected to fail; it is
      # non-fatal, resolveDriftCli() then reports the CLI unavailable, and the
      # semantic pass prints SKIPPED while the structural pass still gates the PR.
      #
      # After publication, set the repository variable DRIFT_SEMANTIC=1 to make
      # a failed install fail the job instead of being ignored.
      - name: Install published Drift CLI (best effort until published)
        run: npm install -g @usedrift/cli || [ "${{ vars.DRIFT_SEMANTIC }}" != "1" ]

      - name: Validate demo fixtures
        run: node scripts/verify-all.mjs

      - name: Validate devcontainers against demos.json
        run: |
          node scripts/sync-devcontainers.mjs --check
          node scripts/verify-devcontainers.mjs

  # Proves each fixture is a real break, using that ecosystem's own toolchain:
  # the baseline must build/run, and the upgraded tree must fail for the stated
  # reason. Structure alone cannot tell a real breaking upgrade from a
  # plausible-looking one.
  oracle:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ecosystem: npm
          - ecosystem: pypi
          - ecosystem: go
          - ecosystem: cargo
          - ecosystem: maven
          - ecosystem: rubygems
          - ecosystem: nuget
          - ecosystem: packagist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - if: matrix.ecosystem == 'pypi'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - if: matrix.ecosystem == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - if: matrix.ecosystem == 'maven'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - if: matrix.ecosystem == 'rubygems'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - if: matrix.ecosystem == 'nuget'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - if: matrix.ecosystem == 'packagist'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Prove the ${{ matrix.ecosystem }} break is real
        run: node scripts/verify-oracle.mjs ${{ matrix.ecosystem }}
